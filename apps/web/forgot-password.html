<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CheapData</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #071a12, #0b3d28);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #0a8f4d;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #0a8f4d;
            box-shadow: 0 0 0 3px rgba(10, 143, 77, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a8f4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #087a41;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #e8f8ef;
            color: #087a41;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0a8f4d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">CheapData</div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter the email address connected to your CheapData account.
            We'll help you reset your password.
        </p>

        <div id="message" class="message"></div>

        <form id="forgotPasswordForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <button type="submit" id="submitButton">
                Continue
            </button>

        </form>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

    </div>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");
        const messageBox = document.getElementById("message");

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("Please enter your email address.", "error");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Processing...";

            messageBox.className = "message";
            messageBox.textContent = "";

            try {
                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showMessage(
                        data.message || "Something went wrong.",
                        "error"
                    );

                    submitButton.disabled = false;
                    submitButton.textContent = "Continue";
                    return;
                }

                showMessage(
                    data.message ||
                    "If an account exists with that email, password reset instructions will be provided.",
                    "success"
                );

                emailInput.value = "";

            } catch (error) {
                console.error(error);

                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );
            }

            submitButton.disabled = false;
            submitButton.textContent = "Continue";
        });
    </script>

</body>
</html>
