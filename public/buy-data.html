<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Data - CheapData</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #0b7a3b;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        .balance {
            background: #e8f7ee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #0b7a3b;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .pin-input {
            letter-spacing: 8px;
            text-align: center;
            font-weight: bold;
        }

        .pin-note {
            color: #6b7280;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .networks {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .network {
            padding: 12px 5px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .network.active {
            border-color: #0b7a3b;
            background: #e8f7ee;
            color: #0b7a3b;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .plan {
            padding: 18px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .plan:hover {
            border-color: #0b7a3b;
        }

        .plan.active {
            border-color: #0b7a3b;
            background: #e8f7ee;
        }

        .plan strong {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .price {
            color: #0b7a3b;
            font-weight: bold;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .summary {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 10px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .buy-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #0b7a3b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #096b34;
        }

        .buy-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0b7a3b;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .networks {
                grid-template-columns: repeat(2, 1fr);
            }

            .plans {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CheapData</h1>
</header>

<div class="container">

    <a href="/dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <h2>Buy Data</h2>

        <div class="balance">
            Wallet Balance:
            <span id="balance">₦0</span>
        </div>

        <!-- PHONE -->

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="08012345678"
            maxlength="11"
            inputmode="numeric"
        >

        <!-- NETWORK -->

        <label>Select Network</label>

        <div class="networks">

            <button
                type="button"
                class="network active"
                data-network="MTN"
                onclick="selectNetwork('MTN', this)"
            >
                MTN
            </button>

            <button
                type="button"
                class="network"
                data-network="Airtel"
                onclick="selectNetwork('Airtel', this)"
            >
                Airtel
            </button>

            <button
                type="button"
                class="network"
                data-network="Glo"
                onclick="selectNetwork('Glo', this)"
            >
                Glo
            </button>

            <button
                type="button"
                class="network"
                data-network="9mobile"
                onclick="selectNetwork('9mobile', this)"
            >
                9mobile
            </button>

        </div>

        <!-- DATA PLANS -->

        <label>Select Data Plan</label>

        <div
            class="plans"
            id="plans"
        >
            <div class="loading">
                Loading data plans...
            </div>
        </div>

        <!-- PURCHASE PIN -->

        <label style="margin-top: 25px;">
            Purchase PIN
        </label>

        <input
            type="password"
            id="purchasePin"
            class="pin-input"
            placeholder="••••"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
        >

        <div class="pin-note">
            Enter your 4-digit Purchase PIN to authorize this purchase.
        </div>

        <!-- SUMMARY -->

        <div class="summary">

            <strong>Order Summary</strong>

            <div>
                Network:
                <span id="summaryNetwork">MTN</span>
            </div>

            <div>
                Plan:
                <span id="summaryPlan">Not selected</span>
            </div>

            <div>
                Phone:
                <span id="summaryPhone">Not entered</span>
            </div>

            <div>
                Amount:
                <strong id="summaryAmount">₦0</strong>
            </div>

        </div>

        <!-- BUY BUTTON -->

        <button
            type="button"
            id="buyButton"
            class="buy-btn"
            onclick="purchaseData()"
            disabled
        >
            Select a Data Plan
        </button>

        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>

<script>

    // ==========================================
    // LOGIN / SESSION CHECK
    // ==========================================

    const savedUser =
        localStorage.getItem("cheapdataUser");

    if (!savedUser) {
        window.location.href = "/login.html";
    }

    let user = null;

    try {

        user = JSON.parse(savedUser);

    } catch (error) {

        localStorage.removeItem("cheapdataUser");
        window.location.href = "/login.html";
    }


    // ==========================================
    // VARIABLES
    // ==========================================

    let selectedNetwork = "MTN";
    let selectedPlan = "";
    let selectedPrice = 0;
    let selectedPlanId = null;

    let allPlans = [];


    // ==========================================
    // LOAD SESSION
    // ==========================================

    async function checkSession() {

        try {

            const response =
                await fetch("/api/session");

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success ||
                !data.authenticated
            ) {

                localStorage.removeItem(
                    "cheapdataUser"
                );

                window.location.href =
                    "/login.html";

                return false;
            }

            user = data.user;

            localStorage.setItem(
                "cheapdataUser",
                JSON.stringify(user)
            );

            return true;

        } catch (error) {

            console.error(
                "Session error:",
                error
            );

            return false;
        }
    }


    // ==========================================
    // LOAD BALANCE
    // ==========================================

    async function loadBalance() {

        try {

            const response =
                await fetch(
                    `/api/user/${user.id}`
                );

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                localStorage.removeItem(
                    "cheapdataUser"
                );

                window.location.href =
                    "/login.html";

                return;
            }

            if (data.success) {

                user = data.user;

                localStorage.setItem(
                    "cheapdataUser",
                    JSON.stringify(user)
                );

                document.getElementById(
                    "balance"
                ).textContent =
                    `₦${Number(user.balance).toLocaleString()}`;
            }

        } catch (error) {

            console.error(
                "Balance error:",
                error
            );
        }
    }


    // ==========================================
    // LOAD DATA PLANS FROM DATABASE
    // ==========================================

    async function loadDataPlans() {

        const plansContainer =
            document.getElementById("plans");

        try {

            const response =
                await fetch("/api/data-plans");

            const data =
                await response.json();

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                localStorage.removeItem(
                    "cheapdataUser"
                );

                window.location.href =
                    "/login.html";

                return;
            }

            if (
                !response.ok ||
                !data.success
            ) {

                plansContainer.innerHTML = `
                    <div class="empty">
                        Unable to load data plans.
                    </div>
                `;

                return;
            }

            allPlans = data.plans || [];

            renderPlans();

        } catch (error) {

            console.error(
                "Plans error:",
                error
            );

            plansContainer.innerHTML = `
                <div class="empty">
                    Unable to connect to the server.
                </div>
            `;
        }
    }


    // ==========================================
    // DISPLAY PLANS FOR SELECTED NETWORK
    // ==========================================

    function renderPlans() {

        const plansContainer =
            document.getElementById("plans");

        const networkPlans =
            allPlans.filter(
                plan =>
                    plan.network === selectedNetwork
            );

        plansContainer.innerHTML = "";

        if (networkPlans.length === 0) {

            plansContainer.innerHTML = `
                <div class="empty">
                    No data plans available for ${selectedNetwork}.
                </div>
            `;

            selectedPlan = "";
            selectedPrice = 0;
            selectedPlanId = null;

            updateSummary();

            return;
        }

        networkPlans.forEach(plan => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className = "plan";

            button.innerHTML = `
                <strong>
                    ${escapeHTML(plan.data_size)}
                </strong>

                <span class="price">
                    ₦${Number(
                        plan.selling_price
                    ).toLocaleString()}
                </span>
            `;

            button.onclick = function () {

                selectPlan(
                    plan,
                    button
                );
            };

            plansContainer.appendChild(button);
        });

        // Automatically select the first plan

        if (networkPlans.length > 0) {

            const firstPlan =
                networkPlans[0];

            const firstButton =
                plansContainer.querySelector(
                    ".plan"
                );

            selectPlan(
                firstPlan,
                firstButton
            );
        }
    }


    // ==========================================
    // SELECT NETWORK
    // ==========================================

    function selectNetwork(
        network,
        button
    ) {

        selectedNetwork = network;

        document
            .querySelectorAll(".network")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );
            });

        button.classList.add("active");

        document.getElementById(
            "summaryNetwork"
        ).textContent = network;

        // Clear old selection

        selectedPlan = "";
        selectedPrice = 0;
        selectedPlanId = null;

        document.getElementById(
            "summaryPlan"
        ).textContent =
            "Not selected";

        document.getElementById(
            "summaryAmount"
        ).textContent =
            "₦0";

        const buyButton =
            document.getElementById(
                "buyButton"
            );

        buyButton.disabled = true;

        buyButton.textContent =
            "Select a Data Plan";

        // Load plans for this network

        renderPlans();
    }


    // ==========================================
    // SELECT PLAN
    // ==========================================

    function selectPlan(
        plan,
        button
    ) {

        selectedPlan =
            plan.plan_name;

        selectedPrice =
            Number(plan.selling_price);

        selectedPlanId =
            Number(plan.id);

        document
            .querySelectorAll(".plan")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );
            });

        button.classList.add("active");

        document.getElementById(
            "summaryPlan"
        ).textContent =
            plan.data_size;

        document.getElementById(
            "summaryAmount"
        ).textContent =
            `₦${selectedPrice.toLocaleString()}`;

        const buyButton =
            document.getElementById(
                "buyButton"
            );

        buyButton.disabled = false;

        buyButton.textContent =
            `Buy ${plan.data_size} for ₦${selectedPrice.toLocaleString()}`;

        updatePhoneSummary();
    }


    // ==========================================
    // PHONE SUMMARY
    // ==========================================

    document
        .getElementById("phone")
        .addEventListener(
            "input",
            updatePhoneSummary
        );

    function updatePhoneSummary() {

        const phone =
            document.getElementById(
                "phone"
            ).value;

        document.getElementById(
            "summaryPhone"
        ).textContent =
            phone || "Not entered";
    }


    // ==========================================
    // PIN INPUT
    // ==========================================

    document
        .getElementById("purchasePin")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 4);
            }
        );


    // ==========================================
    // UPDATE SUMMARY
    // ==========================================

    function updateSummary() {

        document.getElementById(
            "summaryNetwork"
        ).textContent =
            selectedNetwork;

        document.getElementById(
            "summaryPlan"
        ).textContent =
            selectedPlan || "Not selected";

        document.getElementById(
            "summaryAmount"
        ).textContent =
            selectedPrice
                ? `₦${selectedPrice.toLocaleString()}`
                : "₦0";
    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display =
            "block";
    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==========================================
    // PURCHASE DATA
    // ==========================================

    async function purchaseData() {

        const phone =
            document.getElementById(
                "phone"
            ).value.trim();

        const pin =
            document.getElementById(
                "purchasePin"
            ).value.trim();

        const buyButton =
            document.getElementById(
                "buyButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        // Clear previous message

        message.className =
            "message";

        message.style.display =
            "none";


        // ==========================================
        // VALIDATE PHONE
        // ==========================================

        if (
            !/^0[7-9][0-1][0-9]{8}$/.test(
                phone
            )
        ) {

            showMessage(
                "Please enter a valid Nigerian phone number.",
                "error"
            );

            return;
        }


        // ==========================================
        // VALIDATE PLAN
        // ==========================================

        if (
            !selectedPlan ||
            !selectedPlanId
        ) {

            showMessage(
                "Please select a data plan.",
                "error"
            );

            return;
        }


        // ==========================================
        // VALIDATE PIN
        // ==========================================

        if (
            !/^\d{4}$/.test(pin)
        ) {

            showMessage(
                "Please enter your 4-digit Purchase PIN.",
                "error"
            );

            return;
        }


        // ==========================================
        // REFRESH BALANCE
        // ==========================================

        await loadBalance();


        // ==========================================
        // CHECK BALANCE
        // ==========================================

        if (
            Number(user.balance) <
            selectedPrice
        ) {

            showMessage(
                "Insufficient wallet balance.",
                "error"
            );

            return;
        }


        // ==========================================
        // CONFIRM PURCHASE
        // ==========================================

        const confirmed =
            confirm(
                `Buy ${selectedPlan} ${selectedNetwork} data for ${phone} for ₦${selectedPrice.toLocaleString()}?`
            );

        if (!confirmed) {
            return;
        }


        // ==========================================
        // PROCESSING
        // ==========================================

        buyButton.disabled = true;

        buyButton.textContent =
            "Processing...";


        try {

            /*
             * IMPORTANT:
             * The server now determines the
             * authenticated user from the session.
             *
             * We do NOT send userId here.
             */

            const response =
                await fetch(
                    "/api/buy-data",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            network:
                                selectedNetwork,

                            plan:
                                selectedPlan,

                            phone:
                                phone,

                            amount:
                                selectedPrice,

                            pin:
                                pin
                        })
                    }
                );


            const data =
                await response.json();


            // ==========================================
            // SESSION EXPIRED
            // ==========================================

            if (
                response.status === 401
            ) {

                localStorage.removeItem(
                    "cheapdataUser"
                );

                window.location.href =
                    "/login.html";

                return;
            }


            // ==========================================
            // SERVER ERROR
            // ==========================================

            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    data.message ||
                    "Purchase failed.",
                    "error"
                );

                buyButton.disabled = false;

                buyButton.textContent =
                    `Buy ${selectedPlan} for ₦${selectedPrice.toLocaleString()}`;

                return;
            }


            // ==========================================
            // UPDATE BALANCE
            // ==========================================

            if (
                typeof data.balance !==
                "undefined"
            ) {

                user.balance =
                    data.balance;

                localStorage.setItem(
                    "cheapdataUser",
                    JSON.stringify(user)
                );

                document.getElementById(
                    "balance"
                ).textContent =
                    `₦${Number(
                        data.balance
                    ).toLocaleString()}`;
            }


            // ==========================================
            // SUCCESS
            // ==========================================

            showMessage(
                `Purchase successful! ${data.network || selectedNetwork} ${data.plan || selectedPlan} sent to ${data.phone || phone}. Reference: ${data.reference}`,
                "success"
            );


            buyButton.textContent =
                "Purchase Successful";


            // Clear PIN

            document.getElementById(
                "purchasePin"
            ).value = "";


        } catch (error) {

            console.error(
                "Purchase error:",
                error
            );

            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );

            buyButton.disabled = false;

            buyButton.textContent =
                `Buy ${selectedPlan} for ₦${selectedPrice.toLocaleString()}`;
        }
    }


    // ==========================================
    // START PAGE
    // ==========================================

    async function initializePage() {

        const authenticated =
            await checkSession();

        if (!authenticated) {
            return;
        }

        await loadBalance();

        await loadDataPlans();
    }

    initializePage();

</script>

</body>
</html>
