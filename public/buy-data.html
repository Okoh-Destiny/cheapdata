<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Data - CheapData</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #0b7a3b;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        .balance {
            background: #e8f7ee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #0b7a3b;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0b7a3b;
        }

        .pin-input {
            letter-spacing: 8px;
            text-align: center;
            font-weight: bold;
        }

        .pin-note {
            color: #6b7280;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .networks {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .network {
            padding: 12px 5px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .network:hover {
            border-color: #0b7a3b;
        }

        .network.active {
            border-color: #0b7a3b;
            background: #e8f7ee;
            color: #0b7a3b;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .plan {
            padding: 18px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .plan:hover {
            border-color: #0b7a3b;
            transform: translateY(-1px);
        }

        .plan.active {
            border-color: #0b7a3b;
            background: #e8f7ee;
        }

        .plan strong {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .price {
            color: #0b7a3b;
            font-weight: bold;
            font-size: 18px;
        }

        .validity {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            grid-column: 1 / -1;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            grid-column: 1 / -1;
            background: #f9fafb;
            border-radius: 10px;
        }

        .error-box {
            text-align: center;
            padding: 20px;
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        .retry-btn {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #0b7a3b;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .summary {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 10px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .summary strong:first-child {
            display: block;
            margin-bottom: 5px;
        }

        .buy-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #0b7a3b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #096b34;
        }

        .buy-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            display: block;
            background: #eff6ff;
            color: #1e40af;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0b7a3b;
            text-decoration: none;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            margin-top: 8px;
            color: #6b7280;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px auto;
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .networks {
                grid-template-columns: repeat(2, 1fr);
            }

            .plans {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CheapData</h1>
</header>

<div class="container">

    <a href="/dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <h2>Buy Data</h2>

        <div class="balance">
            Wallet Balance:
            <span id="balance">₦0</span>
        </div>

        <label for="phone">Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="08012345678"
            maxlength="11"
            inputmode="numeric"
            autocomplete="tel"
        >

        <label>Select Network</label>

        <div class="networks">

            <button
                type="button"
                class="network active"
                data-network="MTN"
                onclick="selectNetwork('MTN', this)"
            >
                MTN
            </button>

            <button
                type="button"
                class="network"
                data-network="Airtel"
                onclick="selectNetwork('Airtel', this)"
            >
                Airtel
            </button>

            <button
                type="button"
                class="network"
                data-network="Glo"
                onclick="selectNetwork('Glo', this)"
            >
                Glo
            </button>

            <button
                type="button"
                class="network"
                data-network="9mobile"
                onclick="selectNetwork('9mobile', this)"
            >
                9mobile
            </button>

        </div>

        <label>Select Data Plan</label>

        <div class="plans" id="plans">

            <div class="loading">
                Loading data plans...
            </div>

        </div>

        <div id="planStatus" class="status"></div>

        <label style="margin-top: 25px;">
            Purchase PIN
        </label>

        <input
            type="password"
            id="purchasePin"
            class="pin-input"
            placeholder="••••"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
        >

        <div class="pin-note">
            Enter your 4-digit Purchase PIN to authorize this purchase.
        </div>

        <div class="summary">

            <strong>Order Summary</strong>

            <div>
                Network:
                <span id="summaryNetwork">MTN</span>
            </div>

            <div>
                Plan:
                <span id="summaryPlan">Not selected</span>
            </div>

            <div>
                Phone:
                <span id="summaryPhone">Not entered</span>
            </div>

            <div>
                Amount:
                <strong id="summaryAmount">₦0</strong>
            </div>

        </div>

        <button
            type="button"
            id="buyButton"
            class="buy-btn"
            onclick="purchaseData()"
            disabled
        >
            Select a Data Plan
        </button>

        <div id="message" class="message"></div>

    </div>

</div>

<script>

let user = null;

let selectedNetwork = "MTN";
let selectedPlan = "";
let selectedPrice = 0;
let selectedPlanId = null;

let allPlans = [];


// =========================================================
// MONEY
// =========================================================

function formatMoney(amount) {

    return `₦${Number(amount || 0).toLocaleString()}`;

}


// =========================================================
// GET SAVED USER
// =========================================================

function getSavedUser() {

    try {

        const saved =
            localStorage.getItem("cheapdataUser");

        if (!saved) {
            return null;
        }

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            parsed.id
        ) {

            return parsed;
        }

    } catch (error) {

        console.error(
            "Saved user error:",
            error
        );

    }

    return null;
}


// =========================================================
// UPDATE USER DISPLAY
// =========================================================

function updateUserDisplay() {

    if (!user) {
        return;
    }

    localStorage.setItem(
        "cheapdataUser",
        JSON.stringify(user)
    );

    document.getElementById(
        "balance"
    ).textContent =
        formatMoney(user.balance);

}


// =========================================================
// SESSION
// =========================================================

async function checkSession() {

    /*
     * First try the server session.
     */

    try {

        const response =
            await fetch(
                "/api/session",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );

        let data = {};

        try {

            data =
                await response.json();

        } catch (error) {

            data = {};

        }

        console.log(
            "SESSION CHECK:",
            response.status,
            data
        );


        /*
         * Normal successful session response.
         */

        if (
            response.ok &&
            data.loggedIn === true &&
            data.user
        ) {

            user =
                data.user;

            updateUserDisplay();

            return true;
        }


        /*
         * If server explicitly says the session
         * is not logged in, try the saved user.
         *
         * We do NOT immediately redirect.
         */

        if (
            data.loggedIn === false
        ) {

            const savedUser =
                getSavedUser();

            if (
                savedUser &&
                savedUser.id
            ) {

                user =
                    savedUser;

                updateUserDisplay();

                /*
                 * Verify the saved user against
                 * the authenticated server session.
                 */

                const verify =
                    await fetch(
                        `/api/user/${savedUser.id}`,
                        {
                            method: "GET",
                            credentials: "include",
                            cache: "no-store"
                        }
                    );

                if (
                    verify.ok
                ) {

                    const verifyData =
                        await verify.json();

                    if (
                        verifyData.success &&
                        verifyData.user
                    ) {

                        user =
                            verifyData.user;

                        updateUserDisplay();

                        return true;
                    }
                }
            }

            /*
             * Only now do we consider the user
             * genuinely logged out.
             */

            window.location.href =
                "/login.html";

            return false;
        }


        /*
         * If /api/session returns 404 or some
         * unexpected response, use saved login.
         */

        const savedUser =
            getSavedUser();

        if (
            savedUser &&
            savedUser.id
        ) {

            user =
                savedUser;

            updateUserDisplay();

            try {

                const verify =
                    await fetch(
                        `/api/user/${savedUser.id}`,
                        {
                            method: "GET",
                            credentials: "include",
                            cache: "no-store"
                        }
                    );

                if (
                    verify.ok
                ) {

                    const verifyData =
                        await verify.json();

                    if (
                        verifyData.success &&
                        verifyData.user
                    ) {

                        user =
                            verifyData.user;

                        updateUserDisplay();

                        return true;
                    }
                }

            } catch (error) {

                console.error(
                    "Saved user verification error:",
                    error
                );

            }

        }


        showMessage(
            "Unable to verify your login session. Please refresh the page.",
            "error"
        );

        return false;

    } catch (error) {

        console.error(
            "Session verification error:",
            error
        );


        /*
         * Network error:
         * don't immediately kick the user to login.
         */

        const savedUser =
            getSavedUser();

        if (
            savedUser &&
            savedUser.id
        ) {

            user =
                savedUser;

            updateUserDisplay();

            return true;
        }


        showMessage(
            "Unable to connect to the server. Please make sure CheapData is running.",
            "error"
        );

        return false;
    }
}


// =========================================================
// LOAD BALANCE
// =========================================================

async function loadBalance() {

    if (
        !user ||
        !user.id
    ) {

        return false;
    }


    try {

        const response =
            await fetch(
                `/api/user/${user.id}`,
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch (error) {

            data = {};

        }


        console.log(
            "BALANCE:",
            response.status,
            data
        );


        /*
         * Only redirect if the server explicitly
         * confirms that authentication failed.
         */

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            showMessage(
                "Your login session has expired. Please log in again.",
                "error"
            );

            setTimeout(
                () => {
                    window.location.href =
                        "/login.html";
                },
                1500
            );

            return false;
        }


        if (
            response.ok &&
            data.success &&
            data.user
        ) {

            user =
                data.user;

            updateUserDisplay();

            return true;
        }


        return false;

    } catch (error) {

        console.error(
            "Balance error:",
            error
        );

        return false;
    }
}


// =========================================================
// LOAD DATA PLANS
// =========================================================

async function loadDataPlans() {

    const plansContainer =
        document.getElementById("plans");

    const status =
        document.getElementById("planStatus");


    plansContainer.innerHTML = `
        <div class="loading">
            Loading data plans...
        </div>
    `;


    status.textContent = "";


    try {

        const response =
            await fetch(
                "/api/data-plans",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch (error) {

            data = {};

        }


        console.log(
            "DATA PLANS:",
            response.status,
            data
        );


        /*
         * Do NOT redirect merely because
         * the data-plan request failed.
         */

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            showMessage(
                "Your login session has expired. Please log in again.",
                "error"
            );

            setTimeout(
                () => {
                    window.location.href =
                        "/login.html";
                },
                1500
            );

            return;
        }


        if (!response.ok) {

            plansContainer.innerHTML = `
                <div class="error-box">

                    <strong>
                        Unable to load data plans.
                    </strong>

                    <br><br>

                    Server returned error ${response.status}.

                    <br>

                    <button
                        type="button"
                        class="retry-btn"
                        onclick="loadDataPlans()"
                    >
                        Try Again
                    </button>

                </div>
            `;

            return;
        }


        if (!data.success) {

            plansContainer.innerHTML = `
                <div class="error-box">

                    <strong>
                        ${escapeHTML(
                            data.message ||
                            "Unable to load data plans."
                        )}
                    </strong>

                    <br>

                    <button
                        type="button"
                        class="retry-btn"
                        onclick="loadDataPlans()"
                    >
                        Try Again
                    </button>

                </div>
            `;

            return;
        }


        allPlans =
            Array.isArray(data.plans)
                ? data.plans
                : [];


        if (
            allPlans.length === 0
        ) {

            plansContainer.innerHTML = `
                <div class="empty">

                    <strong>
                        No data plans are available yet.
                    </strong>

                    <br><br>

                    Your account is working correctly,
                    but no active WiseSub plans have been
                    synchronized yet.

                    <br><br>

                    Please synchronize the WiseSub plans
                    from the admin panel.

                </div>
            `;

            status.textContent =
                "0 data plans loaded.";

            clearPlanSelection();

            return;
        }


        status.textContent =
            `${allPlans.length} data plan(s) available.`;

        renderPlans();

    } catch (error) {

        console.error(
            "Plans loading error:",
            error
        );


        plansContainer.innerHTML = `
            <div class="error-box">

                <strong>
                    Unable to connect to the server.
                </strong>

                <br><br>

                Please make sure CheapData is running.

                <br>

                <button
                    type="button"
                    class="retry-btn"
                    onclick="loadDataPlans()"
                >
                    Try Again
                </button>

            </div>
        `;
    }
}


// =========================================================
// RENDER PLANS
// =========================================================

function renderPlans() {

    const plansContainer =
        document.getElementById("plans");


    const networkPlans =
        allPlans.filter(
            plan =>
                String(plan.network).toLowerCase() ===
                String(selectedNetwork).toLowerCase()
        );


    plansContainer.innerHTML = "";


    if (
        networkPlans.length === 0
    ) {

        plansContainer.innerHTML = `
            <div class="empty">

                No data plans available for
                <strong>
                    ${escapeHTML(selectedNetwork)}
                </strong>.

            </div>
        `;

        clearPlanSelection();

        return;
    }


    networkPlans.sort(
        (a, b) =>
            Number(a.selling_price) -
            Number(b.selling_price)
    );


    networkPlans.forEach(
        plan => {

            const button =
                document.createElement("button");


            button.type =
                "button";


            button.className =
                "plan";


            let validityHTML = "";

            if (
                plan.validity
            ) {

                validityHTML = `
                    <span class="validity">
                        ${escapeHTML(plan.validity)}
                    </span>
                `;
            }


            button.innerHTML = `

                <strong>
                    ${escapeHTML(
                        plan.data_size ||
                        plan.plan_name ||
                        "Data"
                    )}
                </strong>

                <span class="price">
                    ${formatMoney(
                        plan.selling_price
                    )}
                </span>

                ${validityHTML}

            `;


            button.onclick =
                function () {

                    selectPlan(
                        plan,
                        button
                    );

                };


            plansContainer.appendChild(
                button
            );

        }
    );


    const firstPlan =
        networkPlans[0];


    const firstButton =
        plansContainer.querySelector(
            ".plan"
        );


    if (
        firstPlan &&
        firstButton
    ) {

        selectPlan(
            firstPlan,
            firstButton
        );
    }
}


// =========================================================
// CLEAR PLAN
// =========================================================

function clearPlanSelection() {

    selectedPlan = "";
    selectedPrice = 0;
    selectedPlanId = null;


    document.getElementById(
        "summaryPlan"
    ).textContent =
        "Not selected";


    document.getElementById(
        "summaryAmount"
    ).textContent =
        "₦0";


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    buyButton.disabled =
        true;


    buyButton.textContent =
        "Select a Data Plan";
}


// =========================================================
// SELECT NETWORK
// =========================================================

function selectNetwork(
    network,
    button
) {

    selectedNetwork =
        network;


    document
        .querySelectorAll(".network")
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    document.getElementById(
        "summaryNetwork"
    ).textContent =
        network;


    clearPlanSelection();

    renderPlans();
}


// =========================================================
// SELECT PLAN
// =========================================================

function selectPlan(
    plan,
    button
) {

    selectedPlan =
        plan.plan_name;


    selectedPrice =
        Number(plan.selling_price);


    selectedPlanId =
        Number(plan.id);


    document
        .querySelectorAll(".plan")
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    if (button) {

        button.classList.add(
            "active"
        );
    }


    document.getElementById(
        "summaryPlan"
    ).textContent =
        plan.data_size ||
        plan.plan_name;


    document.getElementById(
        "summaryAmount"
    ).textContent =
        formatMoney(
            selectedPrice
        );


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    buyButton.disabled =
        false;


    buyButton.textContent =
        `Buy ${
            plan.data_size ||
            plan.plan_name
        } for ${
            formatMoney(selectedPrice)
        }`;


    updatePhoneSummary();
}


// =========================================================
// PHONE
// =========================================================

document
    .getElementById("phone")
    .addEventListener(
        "input",
        updatePhoneSummary
    );


function updatePhoneSummary() {

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    document.getElementById(
        "summaryPhone"
    ).textContent =
        phone ||
        "Not entered";
}


// =========================================================
// PIN
// =========================================================

document
    .getElementById("purchasePin")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 4);

        }
    );


// =========================================================
// MESSAGES
// =========================================================

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        `message ${type}`;


    message.style.display =
        "block";
}


function hideMessage() {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "";


    message.className =
        "message";


    message.style.display =
        "none";
}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// =========================================================
// PURCHASE
// =========================================================

async function purchaseData() {

    hideMessage();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const pin =
        document.getElementById(
            "purchasePin"
        ).value.trim();


    const buyButton =
        document.getElementById(
            "buyButton"
        );


    if (
        !/^0[7-9][0-1][0-9]{8}$/.test(
            phone
        )
    ) {

        showMessage(
            "Please enter a valid Nigerian phone number.",
            "error"
        );

        return;
    }


    if (
        !selectedPlan ||
        !selectedPlanId
    ) {

        showMessage(
            "Please select a data plan.",
            "error"
        );

        return;
    }


    if (
        !/^\d{4}$/.test(pin)
    ) {

        showMessage(
            "Please enter your 4-digit Purchase PIN.",
            "error"
        );

        return;
    }


    const balanceLoaded =
        await loadBalance();


    if (!balanceLoaded || !user) {

        showMessage(
            "Unable to verify your wallet. Please refresh the page and try again.",
            "error"
        );

        return;
    }


    if (
        Number(user.balance) <
        selectedPrice
    ) {

        showMessage(
            `Insufficient wallet balance. You need ${formatMoney(selectedPrice)}.`,
            "error"
        );

        return;
    }


    const confirmed =
        confirm(
            `Buy ${selectedPlan} ${selectedNetwork} data for ${phone} for ${formatMoney(selectedPrice)}?`
        );


    if (!confirmed) {

        return;
    }


    buyButton.disabled =
        true;


    buyButton.textContent =
        "Processing...";


    try {

        const response =
            await fetch(
                "/api/buy-data",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({

                            network:
                                selectedNetwork,

                            plan:
                                selectedPlan,

                            planId:
                                selectedPlanId,

                            phone:
                                phone,

                            amount:
                                selectedPrice,

                            pin:
                                pin

                        })
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch (error) {

            data = {};

        }


        console.log(
            "PURCHASE:",
            response.status,
            data
        );


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            showMessage(
                "Your login session has expired. Please log in again.",
                "error"
            );

            setTimeout(
                () => {
                    window.location.href =
                        "/login.html";
                },
                1500
            );

            return;
        }


        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                "Purchase failed. Please try again.",
                "error"
            );


            buyButton.disabled =
                false;


            buyButton.textContent =
                `Buy ${selectedPlan} for ${formatMoney(selectedPrice)}`;


            return;
        }


        if (
            typeof data.balance !==
            "undefined"
        ) {

            user.balance =
                data.balance;


            updateUserDisplay();


            document.getElementById(
                "balance"
            ).textContent =
                formatMoney(
                    data.balance
                );
        }


        showMessage(
            `Purchase successful! ${
                data.network ||
                selectedNetwork
            } ${
                data.plan ||
                selectedPlan
            } sent to ${
                data.phone ||
                phone
            }. Reference: ${
                data.reference ||
                "N/A"
            }`,
            "success"
        );


        buyButton.textContent =
            "Purchase Successful";


        document.getElementById(
            "purchasePin"
        ).value = "";


    } catch (error) {

        console.error(
            "Purchase error:",
            error
        );


        showMessage(
            "Unable to connect to the server. Please try again.",
            "error"
        );


        buyButton.disabled =
            false;


        buyButton.textContent =
            `Buy ${selectedPlan} for ${formatMoney(selectedPrice)}`;
    }
}


// =========================================================
// INITIALIZE
// =========================================================

async function initializePage() {

    console.log(
        "CheapData Buy Data page starting..."
    );


    const authenticated =
        await checkSession();


    if (!authenticated) {

        return;
    }


    console.log(
        "Authenticated user:",
        user
    );


    await loadBalance();

    await loadDataPlans();
}


initializePage();

</script>
