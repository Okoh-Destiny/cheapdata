    <style>
        * {
            box-sizing: border-box;

            padding: 0;
            font-family: Arial, sans-serif;

        body {

        .container {

            margin: 30px auto;

        .card {

        .network.active {

<body>

<header>
    <h1>CheapData</h1>
</header>

<div class="container">

    <a href="/dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <h2>Buy Data</h2>

        <div class="balance">
            Wallet Balance:
            <span id="balance">₦0</span>
        </div>

        <!-- PHONE -->

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="08012345678"
            maxlength="11"
            inputmode="numeric"
        >

        <!-- NETWORK -->

        <label>Select Network</label>

        <div class="networks">

            <button
                type="button"
                class="network active"
                onclick="selectNetwork('MTN', this)"
            >
                MTN
            </button>

            <button
                type="button"
                class="network"
                onclick="selectNetwork('Airtel', this)"
            >
                Airtel
            </button>

            <button
                type="button"
                class="network"
                onclick="selectNetwork('Glo', this)"
            >
                Glo
            </button>

            <button
                type="button"
                class="network"
                onclick="selectNetwork('9mobile', this)"
            >
                9mobile
            </button>

        </div>

        <!-- DATA PLANS -->

        <label>Select Data Plan</label>

        <div class="plans">

            <button
                type="button"
                class="plan"
                onclick="selectPlan('1GB', 250, this)"
            >
                <strong>1GB</strong>
                <span class="price">₦250</span>
            </button>

            <button
                type="button"
                class="plan"
                onclick="selectPlan('2GB', 500, this)"
            >
                <strong>2GB</strong>
                <span class="price">₦500</span>
            </button>

            <button
                type="button"
                class="plan"
                onclick="selectPlan('5GB', 1250, this)"
            >
                <strong>5GB</strong>
                <span class="price">₦1,250</span>
            </button>

            <button
                type="button"
                class="plan"
                onclick="selectPlan('10GB', 2500, this)"
            >
                <strong>10GB</strong>
                <span class="price">₦2,500</span>
            </button>

            <button
                type="button"
                class="plan"
                onclick="selectPlan('20GB', 5000, this)"
            >
                <strong>20GB</strong>
                <span class="price">₦5,000</span>
            </button>

            <button
                type="button"
                class="plan"
                onclick="selectPlan('40GB', 10000, this)"
            >
                <strong>40GB</strong>
                <span class="price">₦10,000</span>
            </button>

        </div>

        <!-- PURCHASE PIN -->

        <label style="margin-top: 25px;">
            Purchase PIN
        </label>

        <input
            type="password"
            id="purchasePin"
            class="pin-input"
            placeholder="••••"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
        >

        <div class="pin-note">
            Enter your 4-digit Purchase PIN to authorize this purchase.
        </div>

        <!-- SUMMARY -->

        <div class="summary">

            <strong>Order Summary</strong>

            <div>
                Network:
                <span id="summaryNetwork">MTN</span>
            </div>

            <div>
                Plan:
                <span id="summaryPlan">Not selected</span>
            </div>

            <div>
                Phone:
                <span id="summaryPhone">Not entered</span>
            </div>

            <div>
                Amount:
                <strong id="summaryAmount">₦0</strong>
            </div>

        </div>

        <!-- BUY BUTTON -->

        <button
            type="button"
            id="buyButton"
            class="buy-btn"
            onclick="purchaseData()"
            disabled
        >
            Select a Data Plan
        </button>

        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>

<script>

    // =========================
    // LOGIN CHECK
    // =========================

    const savedUser =
        localStorage.getItem("cheapdataUser");

    if (!savedUser) {
        window.location.href = "/login.html";
    }

    let user;

    try {

        user = JSON.parse(savedUser);

    } catch (error) {

        localStorage.removeItem("cheapdataUser");

        window.location.href = "/login.html";
    }

    // =========================
    // VARIABLES
    // =========================

    let selectedNetwork = "MTN";
    let selectedPlan = "";
    let selectedPrice = 0;

    // =========================
    // LOAD BALANCE
    // =========================

    async function loadBalance() {

        try {

            const response =
                await fetch(`/api/user/${user.id}`);

            const data =
                await response.json();

            if (data.success) {

                user = data.user;

                localStorage.setItem(
                    "cheapdataUser",
                    JSON.stringify(user)
                );

                document.getElementById("balance")
                    .textContent =
                    `₦${Number(user.balance).toLocaleString()}`;
            }

        } catch (error) {

            console.error(
                "Balance error:",
                error
            );
        }
    }

    loadBalance();

    // =========================
    // SELECT NETWORK
    // =========================

    function selectNetwork(network, button) {

        selectedNetwork = network;

        document
            .querySelectorAll(".network")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        button.classList.add("active");

        document.getElementById(
            "summaryNetwork"
        ).textContent = network;
    }

    // =========================
    // SELECT PLAN
    // =========================

    function selectPlan(plan, price, button) {

        selectedPlan = plan;
        selectedPrice = price;

        document
            .querySelectorAll(".plan")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        button.classList.add("active");

        document.getElementById(
            "summaryPlan"
        ).textContent = plan;

        document.getElementById(
            "summaryAmount"
        ).textContent =
            `₦${price.toLocaleString()}`;

        const buyButton =
            document.getElementById("buyButton");

        buyButton.disabled = false;

        buyButton.textContent =
            `Buy ${plan} for ₦${price.toLocaleString()}`;

        updatePhoneSummary();
    }

    // =========================
    // PHONE SUMMARY
    // =========================

    document
        .getElementById("phone")
        .addEventListener(
            "input",
            updatePhoneSummary
        );

    function updatePhoneSummary() {

        const phone =
            document.getElementById("phone")
                .value;

        document.getElementById(
            "summaryPhone"
        ).textContent =
            phone || "Not entered";
    }

    // =========================
    // PIN INPUT
    // =========================

    document
        .getElementById("purchasePin")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 4);
            }
        );

    // =========================
    // SHOW MESSAGE
    // =========================

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display = "block";
    }

    // =========================
    // PURCHASE DATA
    // =========================

    async function purchaseData() {

        const phone =
            document.getElementById("phone")
                .value
                .trim();

        const pin =
            document.getElementById("purchasePin")
                .value
                .trim();

        const buyButton =
            document.getElementById("buyButton");

        // Clear previous message

        const message =
            document.getElementById("message");

        message.className = "message";
        message.style.display = "none";

        // =========================
        // VALIDATE PHONE
        // =========================

        if (!/^0[7-9][0-1][0-9]{8}$/.test(phone)) {

            showMessage(
                "Please enter a valid Nigerian phone number.",
                "error"
            );

            return;
        }

        // =========================
        // VALIDATE PLAN
        // =========================

        if (!selectedPlan || !selectedPrice) {

            showMessage(
                "Please select a data plan.",
                "error"
            );

            return;
        }

        // =========================
        // VALIDATE PIN
        // =========================

        if (!/^\d{4}$/.test(pin)) {

            showMessage(
                "Please enter your 4-digit Purchase PIN.",
                "error"
            );

            return;
        }

        // =========================
        // CHECK BALANCE
        // =========================

        if (Number(user.balance) < selectedPrice) {

            showMessage(
                "Insufficient wallet balance.",
                "error"
            );

            return;
        }

        // =========================
        // CONFIRM PURCHASE
        // =========================

        const confirmed = confirm(
            `Buy ${selectedPlan} ${selectedNetwork} data for ${phone} for ₦${selectedPrice.toLocaleString()}?`
        );

        if (!confirmed) {
            return;
        }

        // =========================
        // PROCESSING
        // =========================

        buyButton.disabled = true;

        buyButton.textContent =
            "Processing...";

        try {

            const response =
                await fetch(
                    "/api/purchase-data",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            userId: user.id,

                            network:
                                selectedNetwork,

                            plan:
                                selectedPlan,

                            phone:
                                phone,

                            amount:
                                selectedPrice,

                            pin:
                                pin
                        })
                    }
                );

            const data =
                await response.json();

            // =========================
            // SERVER ERROR
            // =========================

            if (!response.ok || !data.success) {

                showMessage(
                    data.message ||
                    "Purchase failed.",
                    "error"
                );

                buyButton.disabled = false;

                buyButton.textContent =
                    `Buy ${selectedPlan} for ₦${selectedPrice.toLocaleString()}`;

                return;
            }

            // =========================
            // UPDATE BALANCE
            // =========================

            user.balance =
                data.balance;

            localStorage.setItem(
                "cheapdataUser",
                JSON.stringify(user)
            );

            document.getElementById(
                "balance"
            ).textContent =
                `₦${Number(data.balance).toLocaleString()}`;

            // =========================
            // SUCCESS
            // =========================

            showMessage(
                `Purchase successful! ${data.network} ${data.plan} sent to ${data.phone}. Reference: ${data.reference}`,
                "success"
            );

            buyButton.textContent =
                "Purchase Successful";

            // Clear PIN

            document.getElementById(
                "purchasePin"
            ).value = "";

        } catch (error) {

            console.error(
                "Purchase error:",
                error
            );

            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );

            buyButton.disabled = false;

            buyButton.textContent =
                `Buy ${selectedPlan} for ₦${selectedPrice.toLocaleString()}`;
        }
    }

</script>

</body>
</html>
