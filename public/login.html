<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CheapData</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 18px 7%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            color: #16a34a;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #16a34a;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            margin-bottom: 0;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 8px;
            margin-bottom: 20px;
            color: #16a34a;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
        }

        .register-text a {
            color: #16a34a;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #16a34a;
        }

        footer {
            margin-top: auto;
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 35px auto;
            }

            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo">CheapData</a>
    </header>

    <div class="container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CheapData account
            </p>

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <div class="password-container">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a
                    href="/forgot-password.html"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <div id="message" class="message"></div>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="/register.html">
                    Create Account
                </a>
            </p>

            <a href="/" class="back-home">
                ← Back to Homepage
            </a>

        </div>

    </div>

    <footer>
        © 2026 CheapData. All rights reserved.
    </footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.style.display = "none";
            message.className = "message";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Login failed."
                    );
                }

                localStorage.setItem(
                    "cheapdataUser",
                    JSON.stringify(data.user)
                );

                message.textContent = "Login successful!";
                message.classList.add("success");
                message.style.display = "block";

                setTimeout(() => {
                    window.location.href = "/dashboard.html";
                }, 700);

            } catch (error) {

                message.textContent =
                    error.message ||
                    "Unable to login. Please try again.";

                message.classList.add("error");
                message.style.display = "block";

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
