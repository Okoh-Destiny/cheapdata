<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CheapData</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #071a12, #0b3d28);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #0a8f4d;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #0a8f4d;
            box-shadow: 0 0 0 3px rgba(10, 143, 77, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a8f4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #087a41;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #e8f8ef;
            color: #087a41;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0a8f4d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .password-hint {
            font-size: 12px;
            color: #777;
            margin-top: -10px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">CheapData</div>

        <h1>Reset Password</h1>

        <p class="description">
            Create a new password for your CheapData account.
        </p>

        <div id="message" class="message"></div>

        <form id="resetPasswordForm">

            <label for="newPassword">New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <p class="password-hint">
                Password must be at least 6 characters.
            </p>

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit" id="resetButton">
                Reset Password
            </button>

        </form>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

    </div>

    <script>

        const form = document.getElementById("resetPasswordForm");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const resetButton = document.getElementById("resetButton");
        const messageBox = document.getElementById("message");

        // Get reset token from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
        }

        // Make sure a token exists
        if (!token) {
            showMessage(
                "This password reset link is invalid or incomplete.",
                "error"
            );

            resetButton.disabled = true;
        }

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            if (!token) {
                showMessage(
                    "This password reset link is invalid or incomplete.",
                    "error"
                );
                return;
            }

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword.length < 6) {
                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage(
                    "The passwords do not match.",
                    "error"
                );
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Resetting...";

            messageBox.className = "message";
            messageBox.textContent = "";

            try {

                const response = await fetch("/api/reset-password", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {

                    showMessage(
                        data.message ||
                        "Unable to reset your password.",
                        "error"
                    );

                    resetButton.disabled = false;
                    resetButton.textContent = "Reset Password";

                    return;
                }

                showMessage(
                    data.message ||
                    "Password reset successfully. You can now log in.",
                    "success"
                );

                newPasswordInput.value = "";
                confirmPasswordInput.value = "";

                resetButton.disabled = true;
                resetButton.textContent = "Password Reset";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }

        });

    </script>

</body>
</html>
